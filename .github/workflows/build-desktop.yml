name: Build Windows desktop app

on:
  push:
    branches: [main, ccr-d4a02aa7-er0jxd]
    paths:
      - 'desktop/**'
      - 'app/src/main/java/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # jpackage builds a self-contained installer (its own Java runtime); WiX is fetched by the Compose plugin
      - name: Build MSI and EXE installers
        run: gradle :desktop:packageMsi :desktop:packageExe --configure-on-demand --stacktrace

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem desktop/build/compose/binaries/main -Recurse -Include *.msi,*.exe | Copy-Item -Destination out
          Get-ChildItem out

      # Release assets do not count against the Actions artifact storage quota
      - name: Publish to a GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AeroFast Pro for Windows (${GITHUB_SHA::7})" \
            --notes "Windows installer built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC').

          - AeroFast Pro-*.msi: standard Windows installer (recommended)
          - AeroFast Pro-*.exe: the same app as an .exe installer

          The installer is not code-signed yet, so Windows SmartScreen may show 'Windows protected your PC': click More info, then Run anyway."
