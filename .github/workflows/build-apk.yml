name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradlew script is committed; use the version pinned in gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Optional: a fixed debug keystore lets each new APK install over the previous one.
      # Without it every run signs with a fresh key and the old app must be uninstalled first.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore

      # No API key is passed in: the APK is published, and any key inside it could be extracted.
      # Users enter their own Gemini key in Settings → AI Settings.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Proves the obfuscated (R8) release code builds on every push; signing is not needed for this step
      - name: Check release shrinking / obfuscation (R8)
        run: gradle :app:minifyReleaseWithR8 --stacktrace

      # Play Store upload: a signed release bundle, built only when the upload-key secrets exist.
      # Kept as a private run artifact (not on the public release page).
      - name: Build signed release bundle (AAB)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.UPLOAD_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" gradle :app:bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab "AeroFastPro-release-${GITHUB_SHA::7}.aab"

      - uses: actions/upload-artifact@v4
        if: hashFiles('AeroFastPro-release-*.aab') != ''
        with:
          name: AeroFastPro-release-aab
          path: AeroFastPro-release-*.aab
          retention-days: 30

      - name: Rename APK
        id: apk
        run: |
          name="AeroFastPro-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest APK (${GITHUB_SHA::7})" \
            --notes "Debug APK built from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download the .apk below and open it on the phone to install."

      # Release assets do not count toward the Actions artifact storage quota, so the release is the
      # primary download; the run artifact is a convenience and may fail when the quota is full.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7
